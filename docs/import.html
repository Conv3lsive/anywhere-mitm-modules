<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Add Anywhere Modules</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 560px; margin: 10vh auto; padding: 24px; line-height: 1.6; }
    h1 { line-height: 1.2; font-size: 32px; }
    a { color: #538ef7; }
    .button { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #2363da; color: white; text-decoration: none; font-weight: 600; }
    .url { overflow-wrap: anywhere; font-size: 13px; }
    .note { opacity: .75; }
  </style>
</head>
<body>
  <h1 id="title">Add Anywhere Modules</h1>
  <p id="message">Open these MITM rule sets in Anywhere.</p>
  <p><a id="open" class="button" hidden>Open in Anywhere</a></p>
  <p class="note">If the app does not open, copy a subscription URL below into Anywhere's MITM subscription screen.</p>
  <div id="urls"></div>
  <p><a href="https://github.com/Conv3lsive/anywhere-mitm-modules">View modules and setup instructions</a></p>
  <noscript>Enable JavaScript for the import button, or copy a subscription URL from the repository README.</noscript>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const ref = query.get("ref") || "3c51a7ec2d58d35a6ab1909750e2a4bb39801cd4";
      const requested = query.get("module") || "all";
      const selected = requested === "spotify-snapshot" ? "spotify" : requested;
      const archivedWorking = ref === "d3fc27488eaa48e91a7ef39a6cf464c142ab72d6";
      const spotifyFiles = archivedWorking ? [
        ["Spotify Snapshot Trial", "modules/spotify-snapshot.amrs"],
        ["Spotify Snapshot Ads", "routing/spotify-snapshot-ads.arrs"],
        ["Spotify Network", "routing/spotify-network.arrs"]
      ] : [
        ["Spotify Premium", "modules/spotify.amrs"],
        ["Spotify Ads", "routing/spotify-reject.arrs"],
        ["Spotify Network", "routing/spotify-network.arrs"]
      ];
      const modules = {
        youtube: { name: "YouTube Ad Block & Playback", files: [["YouTube Ad Block & Playback", "modules/youtube.amrs"]] },
        spotify: { name: "Spotify Premium", files: spotifyFiles },
        soundcloud: { name: "SoundCloud Go+ Configuration", files: [["SoundCloud Go+ Configuration", "modules/soundcloud.amrs"]] }
      };
      if (!/^[a-f0-9]{40}$/.test(ref) || (selected !== "all" && !Object.hasOwn(modules, selected))) {
        document.getElementById("message").textContent = "Invalid module or version. Use an import link from the repository README.";
        return;
      }
      const ids = selected === "all" ? ["youtube", "spotify", "soundcloud"] : [selected];
      document.getElementById("title").textContent = selected === "all" ? "Add All Three Modules" : modules[selected].name;
      const files = ids.flatMap(id => modules[id].files);
      const links = files.map(([, path]) => "https://raw.githubusercontent.com/Conv3lsive/anywhere-mitm-modules/" + ref + "/" + path);
      if (ids.includes("spotify")) {
        document.getElementById("message").textContent = "Imports Spotify Premium and its two routing sets. In Anywhere Routing, select your proxy for Spotify Network and keep " + spotifyFiles[1][0] + " on REJECT. Use Normal audio quality and QUIC Automatic. Playback confirmed by a user on Spotify 9.1.88.2209.";
      }
      const open = document.getElementById("open");
      open.href = "anywhere://add-rule-set?" + links.map(link => "link=" + encodeURIComponent(link)).join("&");
      open.hidden = false;
      for (let i = 0; i < links.length; i++) {
        const item = document.createElement("p");
        item.className = "url";
        const name = document.createElement("strong");
        name.textContent = files[i][0];
        const url = document.createElement("a");
        url.href = links[i];
        url.textContent = links[i];
        item.append(name, document.createElement("br"), url);
        document.getElementById("urls").append(item);
      }
    })();
  </script>
</body>
</html>
